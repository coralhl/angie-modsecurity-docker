user angie;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    # 🔒 Скрыть версию
    server_tokens off; # Отключение отправки версии сервера Engie

    # Advanced headers control
    include /etc/angie/includes/security/headers-advanced.conf;

    # Rate Limiting (защита от DDoS)
    include /etc/angie/includes/security/rate-limiting.conf;

    # ACME клиент (тестовая конфигурация)
    include /etc/angie/includes/security/acme-simple.conf;

    # DNS resolver для Docker контейнеров (upstream)
    # Если используете proxy_pass к Docker контейнерам - это обязательно!
    # 127.0.0.11 - Docker встроенный DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Вспомогательная переменная для проксирования websockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Обогащение логов (GeoIP, User-Agent, Security, Performance, etc)
    include /etc/angie/includes/logs/enrichment.conf;

    # Дополнительные форматы логирования
    include /etc/angie/includes/logs/log-formats.conf;

    # VTS Monitoring
    include /etc/angie/includes/monitoring/vts.conf;

    # Access log с обогащенными данными
    # buffer=64k - буфер 64KB (больше из-за обогащенных данных)
    # flush=5s - принудительная запись каждые 5 секунд
    access_log /var/log/angie/access.log json_enriched buffer=64k flush=5s;

    # Error log
    error_log /var/log/angie/error.log warn;

    # Кастомные error pages
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 502 /errors/502.html;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Compression (Brotli, Zstd, Gzip)
    include /etc/angie/includes/performance/compression.conf;

    include /etc/angie/includes/security/ssl-params.conf;

    include /etc/angie/conf.d/*.conf;
}

stream {
    include /etc/angie/stream.d/*.conf;
}
